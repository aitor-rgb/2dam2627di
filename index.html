<script data-purpose="capacity-counter-logic">
    (function initCapacityApp() {
      // Internal Counter States
      let menCount = 0;
      let womenCount = 0;
      const MAX_CAPACITY = 120;
      
      // History of entries to allow natural decrementing
      let historyStack = [];

      // DOM Elements
      const totalCountEl = document.getElementById('total-count');
      const labelPersonasEl = document.getElementById('label-personas');
      const menCountEl = document.getElementById('men-count');
      const womenCountEl = document.getElementById('women-count');
      const capacityBarEl = document.getElementById('capacity-bar');
      const capacityTextEl = document.getElementById('capacity-text');
      const clockEl = document.getElementById('current-clock');

      const btnAddMale = document.getElementById('btn-add-male');
      const btnAddFemale = document.getElementById('btn-add-female');
      const btnSubtract = document.getElementById('btn-subtract');
      const btnReset = document.getElementById('btn-reset');

      // Update UI elements based on state
      function updateDisplay() {
        const total = menCount + womenCount;
        
        // Update numbers
        totalCountEl.textContent = total;
        menCountEl.textContent = menCount;
        womenCountEl.textContent = womenCount;

        // Dynamic singular / plural label
        if (total === 1) {
          labelPersonasEl.textContent = "Persona en el Club";
        } else {
          labelPersonasEl.textContent = "Personas en el Club";
        }

        // Capacity limit controls (Restriction 1)
        if (total >= MAX_CAPACITY) {
          btnAddMale.disabled = true;
          btnAddFemale.disabled = true;
        } else {
          btnAddMale.disabled = false;
          btnAddFemale.disabled = false;
        }

        // Subtraction button disabling at 0 (Restriction 3)
        if (total <= 0) {
          btnSubtract.disabled = true;
        } else {
          btnSubtract.disabled = false;
        }

        // Calculate occupancy percentage
        const percentage = Math.min(Math.round((total / MAX_CAPACITY) * 100), 100);
        capacityBarEl.style.width = `${percentage}%`;
        capacityTextEl.textContent = `${total} / ${MAX_CAPACITY} pax (${percentage}%)`;

        // Update color alert if near capacity
        if (percentage >= 95) {
          capacityBarEl.className = "h-full rounded-full bg-gradient-to-r from-red-600 via-rose-500 to-amber-400 transition-all duration-300";
        } else {
          capacityBarEl.className = "h-full rounded-full bg-gradient-to-r from-amber-600 via-amber-400 to-amber-200 transition-all duration-300 ease-out";
        }
      }

      // Add Man
      btnAddMale.addEventListener('click', () => {
        if (menCount + womenCount >= MAX_CAPACITY) return;
        menCount++;
        historyStack.push('male');
        updateDisplay();
      });

      // Add Woman
      btnAddFemale.addEventListener('click', () => {
        if (menCount + womenCount >= MAX_CAPACITY) return;
        womenCount++;
        historyStack.push('female');
        updateDisplay();
      });

      // Subtract 1 Person
      btnSubtract.addEventListener('click', () => {
        const total = menCount + womenCount;
        if (total <= 0) return;

        // Try to decrement using historical sequence, or fall back to whichever is > 0
        let decremented = false;
        while (historyStack.length > 0 && !decremented) {
          const lastAdded = historyStack.pop();
          if (lastAdded === 'male' && menCount > 0) {
            menCount--;
            decremented = true;
          } else if (lastAdded === 'female' && womenCount > 0) {
            womenCount--;
            decremented = true;
          }
        }

        // Fallback check to prevent negative values
        if (!decremented) {
          if (menCount > 0) {
            menCount--;
          } else if (womenCount > 0) {
            womenCount--;
          }
        }

        // Ensure non-negative bounds
        menCount = Math.max(0, menCount);
        womenCount = Math.max(0, womenCount);

        updateDisplay();
      });

      // Reset
      btnReset.addEventListener('click', () => {
        const total = menCount + womenCount;
        if (total === 0) return;

        if (confirm('¿Desea reiniciar el conteo del club a cero?')) {
          menCount = 0;
          womenCount = 0;
          historyStack = [];
          updateDisplay();
        }
      });

      // Clock function for speakeasy ambiance
      function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        clockEl.textContent = `${hrs}:${mins}:${secs} HRS`;
      }
      setInterval(updateClock, 1000);
      updateClock();

      // Initial render
      updateDisplay();
    })();
  </script>
